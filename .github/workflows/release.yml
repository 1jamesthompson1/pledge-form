name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run lint && npm run build
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "before_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_ENV"
          npm run release
      - name: Deploy bundle to release branch and release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          cp dist/index.html /tmp/pledge-form.html
          git checkout --orphan release
          git rm -rf --quiet .
          cp /tmp/pledge-form.html pledge-form.html
          git add pledge-form.html
          git commit -m "chore: publish pledge-form.html from ${GITHUB_SHA::8}"
          git push --force origin release
          if [ -n "$NEW_TAG" ] && [ "$NEW_TAG" != "$before_tag" ]; then
            gh release upload "$NEW_TAG" /tmp/pledge-form.html#te-ra-pledge-form.html --clobber
          fi
      - name: Purge jsDelivr CDN cache
        run: curl -sSf "https://purge.jsdelivr.net/gh/1jamesthompson1/pledge-form@release/pledge-form.html"

  verify-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Build form bundle
        run: npm run build
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci
      - name: Sync shared config and smoke test PDF against example data
        working-directory: functions
        run: npm run sync:config && npm test
