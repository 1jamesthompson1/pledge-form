name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run lint && npm run build
      - name: Verify embed bundle is up to date
        run: git diff --exit-code -- embed/
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
      - name: Purge jsDelivr CDN cache
        run: curl -sSf "https://purge.jsdelivr.net/gh/1jamesthompson1/pledge-form@main/embed/pledge-form.html"

  verify-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install functions dependencies
        working-directory: functions
        run: npm ci
      - name: Sync shared config and smoke test PDF against example data
        working-directory: functions
        run: npm run sync:config && npm test
