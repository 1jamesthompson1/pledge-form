special character.",pledgeInfoTitle:"More information about Special Character Donations",pledgeInfoBody:"At this time of year we prepare our budget for the following year. Knowing what parents will contribute is an important part of our planning process. This money enables us to deliver Waldorf education and to manage the financial commitments we have as the owners of this land and the buildings.<br><br>Unlike state schools, our land and buildings are owned by the Kapiti Waldorf Trust. Government funding supports essential maintenance of integrated buildings, although many of the initiatives that enhance our special character, support our curriculum, or improve our grounds, rely on funding from our school community. Donations allow us to care for our environment in a way that reflects Waldorf values.<br><br>We ask that all parents submit a special character donation that allows us to keep doing what we are doing. The school has used a donation-based approach since foundation days back in 1996. It is based on mutual trust and cooperation which we prefer to a fee-based system. A donation system allows us as a community to collectively carry specific family hardship situations. It also allows whānau to claim back up to 1/3 of their donated contribution with IRD.",disbursementAmounts:"Disbursement",student:"Student",recommended:"Recommended",agreedAmount:"Agreed amount",supplementaryDonation:"Supplementary donation / pay it forward",disbursementIntro:"This disbursement donation covers the materials and meals (kindergarten) supplied to your children during the kindergarten and school year.",disbursementInfoTitle:"More information about Disbursements",disbursementInfoBody:"We aim to procure quality materials and ingredients as this is an important aspect of our special character.<br><br>Examples of disbursement items in the school are crayons, pencils, painting paper, handwork, cooking and woodwork materials. In the kindergarten this includes nutritional ingredients, pain kindergarten1MedicalInfo:"Egg allergy.","eotcSchool-0":"on","eotcSchool-1":"on","eotcSchool-2":"on",eotcKindergartenConsent:"on","photos-0":"on","photos-1":"on","photos-2":"on",school1Amount:"4100",school2Amount:"3280",kindergarten1Amount:"2460",supplementaryDonation:"",school1Disbursement:"400",school2Disbursement:"400",kindergarten1Disbursement:"400",disbursement:"1200",totalPledge:"11040",paymentPlan:"Monthly",pledgeComments:"",emergencyContact1Name:"Emergency One",emergencyContact1Phone:"021 000 0001",emergencyContact1Relationship:"Aunt",emergencyContact2Name:"Emergency Two",emergencyContact2Phone:"021 000 0002",emergencyContact2Relationship:"Uncle",emergencyComments:"",custodyApplies:"on",custodyArrangementCount:"1","custody-0-school1":"on","custody-0-school2":"on","custody-0-livingArrangements":"Children live with Test Parent during the week and stay with their other parent every second weekend.","custody-0-legalRestrictions":"None.","custody-0-financialArrangements":"Pledge and disbursement costs are shared equally between both parents.","custody-0-explanation":"Arrangement agreed between both parents; no court order.",anythingElseComments:"",signature:"Test Signature",otherParentSignature:"Test Signature Two",signatureDate:"2026-08-09"},je={form:We},Fe=`<p>We at {schoolName} collect personal information from you and use it to process this pledge, to enrol and care for your children, and to meet our legal duties. This statement explains what we collect, why, who we share it with, and your rights. Last updated: {year}.</p>

<p><strong>What we collect.</strong> Parent and guardian names, the other parent or guardian's name, email address, children's names, class or age and days of attendance, emergency contacts, medical and health information, custodial and financial arrangements, your consent choices for EOTC, health, conduct and photos, the amounts you pledge, and your signature and date.</p>

<p><strong>Why we collect it.</strong> To record and manage your pledge and donation and issue receipts; to keep your children safe and provide for their health and learning; to obtain and record the consents required for EOTC, medical care and photos; to communicate with you; and to meet our legal and record-keeping obligations.</p>

<p><strong>Who we share it with.</strong> We share it with a small number of school staff who process pledge amounts with Kindo and manage various consent processes. If required due to more complex situations, a wider group of staff may be involved and see the information. We may also disclose information where the law requires or permits it.</p>

<p><strong>Storage and overseas processing.</strong> Information is stored securely and access is restricted. Some of our providers store or process data outside New Zealand (for example, Microsoft Azure data centres in Australia). We use contracts and security controls to require them to protect your information.</p>

<p><strong>Voluntary or required.</strong> Giving us this information is voluntary, but if you do not provide it we may not be able to process your pledge, record your consents, or keep your child safe and properly cared for.</p>

<p><strong>Access and correction.</strong> You can ask to see the personal information we hold about you and ask us to correct it. For privacy questions, contact {trustAdminContact}.</p>

<p><strong>How long we keep it.</strong> We keep information only as long as we need it for the purposes above and to meet our record-keeping requirements. Pledge submissions and their audit records are kept for two years from the date they are submitted, and are then securely deleted.</p>

<p><strong>Photos.</strong> You can change or withdraw your photo consent at any time by contacting the school office.</p>

<p><strong>Complaints.</strong> If you have a privacy concern, please contact us first. You can also complain to the Office of the Privacy Commissioner at <a href="https://www.privacy.org.nz">privacy.org.nz</a> or 0800 803 909.</p>

<p><strong>Our address.</strong> 89 Poplar Avenue, Raumati South, Paraparaumu 5032, Kapiti Coast, Wellington, New Zealand.</p>
